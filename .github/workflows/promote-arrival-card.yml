name: Promote teacher arrival card

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Promote teacher arrival card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          old = "  ['🧾', 'Ιστορικό ενεργειών', 'audit_logs', 'audit'],\n  ['🕐', 'Άφιξη καθηγητή', 'teacher_arrivals', 'teacher-arrival'],\n"
          new = "  ['🧾', 'Ιστορικό ενεργειών', 'audit_logs', 'audit'],\n"
          if old in text:
              text = text.replace(old, new, 1)
          marker = "  ['✅', 'Παρουσίες', 'attendance_records', 'attendance'],\n"
          arrival = "  ['🕐', 'Άφιξη καθηγητή', 'teacher_arrivals', 'teacher-arrival'],\n"
          if arrival not in text:
              text = text.replace(marker, marker + arrival, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/promote-arrival-card.yml
          git commit -m "Show teacher arrival in dashboard quick access" || exit 0
          git rm .github/workflows/promote-arrival-card.yml
          git commit -m "Remove one-time arrival card workflow"
          git push