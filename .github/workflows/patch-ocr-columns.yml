name: Apply OCR columns patch
on:
  push:
    paths:
      - '.github/workflows/patch-ocr-columns.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch OCR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/StudentsView.jsx')
          s = path.read_text(encoding='utf-8')
          marker = '\nasync function prepareImage(file) {'
          if 'async function parseOcrColumns' not in s:
              fn = r'''

async function parseOcrColumns(file, worker) {
  const bitmap = await createImageBitmap(file)
  try {
    const width = bitmap.width
    const height = bitmap.height
    const split = Math.round(width * 0.30)
    const makeColumn = async (fromX, toX) => {
      const canvas = document.createElement('canvas')
      canvas.width = Math.max(1, toX - fromX)
      canvas.height = height
      const ctx = canvas.getContext('2d', { willReadFrequently: true })
      ctx.drawImage(bitmap, fromX, 0, canvas.width, height, 0, 0, canvas.width, height)
      const image = ctx.getImageData(0, 0, canvas.width, height)
      const d = image.data
      for (let i = 0; i < d.length; i += 4) {
        const y = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114
        const v = Math.max(0, Math.min(255, ((y - 128) * 1.65) + 128))
        d[i] = v; d[i + 1] = v; d[i + 2] = v
      }
      ctx.putImageData(image, 0, 0)
      return new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('OCR column image failed')), 'image/jpeg', 0.95))
    }
    const numberBlob = await makeColumn(0, split)
    const nameBlob = await makeColumn(split, width)
    const numberResult = await worker.recognize(numberBlob, { tessedit_pageseg_mode: 6, preserve_interword_spaces: '1' })
    const nameResult = await worker.recognize(nameBlob, { tessedit_pageseg_mode: 6, preserve_interword_spaces: '1' })
    const collectRows = (words) => {
      const usable = (words || []).map((w) => {
        const b = w?.bbox || {}
        const text = normalizeOcrLine(w?.text || '')
        const x = Number(b.x0), y = Number(b.y0), x1 = Number(b.x1), y1 = Number(b.y1)
        return { text, x, y, x1, y1, cy: (y + y1) / 2, h: Math.max(1, y1 - y) }
      }).filter((w) => w.text && Number.isFinite(w.x) && Number.isFinite(w.y) && Number.isFinite(w.x1) && Number.isFinite(w.y1))
      usable.sort((a, b) => a.cy - b.cy || a.x - b.x)
      const rows = []
      for (const w of usable) {
        let row = rows.find((r) => Math.abs(r.cy - w.cy) <= Math.max(8, Math.min(r.h, w.h) * 0.75))
        if (!row) { row = { cy: w.cy, h: w.h, words: [] }; rows.push(row) }
        row.words.push(w); row.cy = row.words.reduce((sum, q) => sum + q.cy, 0) / row.words.length; row.h = Math.max(row.h, w.h)
      }
      return rows.sort((a, b) => a.cy - b.cy).map((r) => ({ cy: r.cy, text: r.words.sort((a, b) => a.x - b.x).map((w) => w.text).join(' ') }))
    }
    const numberRows = collectRows(numberResult.data.words || [])
    const nameRows = collectRows(nameResult.data.words || [])
    const nums = numberRows.map((r) => {
      const matches = r.text.match(/[0-9ΟOIΙΖZΕEAΑSΣGΓΤTΒBqQ]{3,8}/g) || []
      for (const m of matches) {
        const n = normalizeRegistryToken(m)
        if (n.length >= 4 && n.length <= 6) return { cy: r.cy, registryNumber: n }
      }
      return null
    }).filter(Boolean)
    const names = nameRows.map((r) => ({ cy: r.cy, fullName: cleanName(r.text) })).filter((r) => /[A-ZΑ-ΩΆΈΉΊΌΎΏα-ωάέήίόύώ]{2,}/u.test(r.fullName))
    const results = []
    const used = new Set()
    for (const n of nums) {
      let best = null; let bestDistance = Infinity
      for (const row of names) {
        const distance = Math.abs(row.cy - n.cy)
        if (distance < bestDistance && distance <= 45 && !used.has(row)) { best = row; bestDistance = distance }
      }
      if (!best || used.has(best) || results.some((r) => r.registryNumber === n.registryNumber)) continue
      const parts = best.fullName.split(/\s+/).filter(Boolean)
      if (parts.length < 2) continue
      used.add(best)
      results.push({ registryNumber: n.registryNumber, fullName: best.fullName, lastName: parts[0], firstName: parts.slice(1).join(' ') })
    }
    return results
  } finally {
    bitmap.close?.()
  }
}
'''
              if marker not in s: raise SystemExit('prepareImage marker not found')
              s = s.replace(marker, fn + marker, 1)
          old = 'const parsedByColumns = parseOcrWords(result.data.words || [])'
          if old not in s: raise SystemExit('OCR parser call not found')
          s = s.replace(old, 'const parsedByColumns = await parseOcrColumns(file, worker)', 1)
          path.write_text(s, encoding='utf-8')
          PY
      - name: Commit OCR patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/StudentsView.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Read registry and name columns independently'
          git push origin main
