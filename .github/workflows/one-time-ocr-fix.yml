name: One-time OCR column parser fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Anco-Solutions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch OCR and zoom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/StudentsView.jsx')
          s = p.read_text(encoding='utf-8')

          start = s.index('function parseOcrLines(lines) {')
          end = s.index('\n\nasync function prepareImage', start)
          replacement = r'''function parseOcrLines(lines) {
  const results = []; const seen = new Set(); const blocked = /(ΗΜΕΡ|ΠΑΡΟΥΣ|ΣΠΟΥΔΑΣΤ|ΟΝΟΜΑΤΕΠΩΝ|ΕΠΩΝΥΜ|ΗΜΕΡΟΜΗΝ|ΥΠΟΓΡΑΦ|ΣΧΟΛΗ|ΤΜΗΜΑ|ΕΞΑΜΗΝΟ)/iu
  for (const rawLine of lines) { const line = normalizeOcrLine(rawLine); if (!line || blocked.test(line)) continue; const candidates = [...line.matchAll(/(?:^|\s)([0-9ΟOIΙΖZΕEAΑSΣGΓΤTΒBqQ]{4,8})(?=\s|$)/g)]; let selected = null; for (const candidate of candidates) { const registryNumber = normalizeRegistryToken(candidate[1]); if (registryNumber.length >= 4 && registryNumber.length <= 6) { selected = { candidate, registryNumber }; break } } if (!selected || seen.has(selected.registryNumber)) continue; let fullName = cleanName(line.slice(selected.candidate.index + selected.candidate[0].length)); if (!fullName || !/[A-ZΑ-ΩΆΈΉΊΌΎΏα-ωάέήίόύώ]/u.test(fullName)) continue; const parts = fullName.split(/\s+/).filter(Boolean); if (parts.length < 2) continue; if (fullName.length > 100) fullName = fullName.slice(0, 100).trim(); seen.add(selected.registryNumber); results.push({ registryNumber: selected.registryNumber, fullName, lastName: parts[0] || '', firstName: parts.slice(1).join(' ') }) }
  return results
}

function parseOcrWords(words) {
  const usable = (words || []).map((word) => {
    const text = normalizeOcrLine(word?.text || ''); const bbox = word?.bbox || {}; const x = Number(bbox.x0); const y = Number(bbox.y0); const x1 = Number(bbox.x1); const y1 = Number(bbox.y1); return { text, x, y, x1, y1, cy: (y + y1) / 2, h: Math.max(1, y1 - y) }
  }).filter((word) => word.text && Number.isFinite(word.x) && Number.isFinite(word.y) && Number.isFinite(word.x1) && Number.isFinite(word.y1))
  usable.sort((a, b) => a.cy - b.cy || a.x - b.x)
  const rows = []
  for (const word of usable) {
    let row = rows.find((candidate) => Math.abs(candidate.cy - word.cy) <= Math.max(12, Math.min(candidate.h, word.h) * 0.65))
    if (!row) { row = { cy: word.cy, h: word.h, words: [] }; rows.push(row) }
    row.words.push(word); row.cy = row.words.reduce((sum, item) => sum + item.cy, 0) / row.words.length; row.h = Math.max(row.h, word.h)
  }
  const results = []; const seen = new Set()
  for (const row of rows.sort((a, b) => a.cy - b.cy)) {
    const lineWords = row.words.sort((a, b) => a.x - b.x)
    let numberIndex = -1; let registryNumber = ''
    for (let i = 0; i < lineWords.length; i += 1) {
      const candidate = normalizeRegistryToken(lineWords[i].text)
      if (candidate.length >= 4 && candidate.length <= 6 && /^[0-9]{4,6}$/.test(candidate)) { numberIndex = i; registryNumber = candidate; break }
    }
    if (numberIndex < 0 || seen.has(registryNumber)) continue
    const nameWords = lineWords.slice(numberIndex + 1).map((word) => word.text).filter((text) => /[A-ZΑ-ΩΆΈΉΊΌΎΏα-ωάέήίόύώ]/u.test(text))
    if (nameWords.length < 2) continue
    const lastName = cleanName(nameWords[0]); const firstName = cleanName(nameWords.slice(1).join(' '))
    if (!lastName || !firstName) continue
    seen.add(registryNumber); results.push({ registryNumber, fullName: `${lastName} ${firstName}`.trim(), lastName, firstName })
  }
  return results
}'''
          s = s[:start] + replacement + s[end:]

          s = s.replace('const parsed = parseOcrLines(lines);', "const words = result.data.words || []; const parsedByColumns = parseOcrWords(words); const parsed = parsedByColumns.length ? parsedByColumns : parseOcrLines(lines);")
          s = s.replace("'Δεν εντοπίστηκε αξιόπιστη γραμμή ΑΜ + ονοματεπώνυμο. Κάντε crop ώστε να μείνει μόνο ο πίνακας και δοκιμάστε ξανά.'", "'Δεν εντοπίστηκε αξιόπιστη γραμμή αριθμού μητρώου + ονοματεπώνυμο. Το OCR διαβάζει πλέον τις λέξεις ανά γραμμή και τις αντιστοιχίζει από αριστερά προς τα δεξιά, χωρίς να ψάχνει τις επικεφαλίδες.'")
          s = s.replace("onPointerUp={() => { stopDrag(); setActiveCorner(null) }} onPointerCancel={() => { stopDrag(); setActiveCorner(null) }}", "onPointerUp={stopDrag} onPointerCancel={stopDrag}")
          old = '<div style={{ position: \'absolute\', left: \'50%\', top: \'50%\', width: 32, height: 32, marginLeft: -16, marginTop: -16, border: \'2px solid #fff\', borderRadius: \'50%\', boxShadow: \'0 0 0 1px #17233b\' }} />'
          new = old + "<div style={{ position: 'absolute', left: '50%', top: '50%', width: 2, height: 46, marginLeft: -1, marginTop: -23, background: '#fff', boxShadow: '0 0 2px #17233b' }} /><div style={{ position: 'absolute', left: '50%', top: '50%', width: 46, height: 2, marginLeft: -23, marginTop: -1, background: '#fff', boxShadow: '0 0 2px #17233b' }} />"
          if old not in s:
              raise SystemExit('zoom marker pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit source patch and remove this workflow
        run: |
          git config user.name "Anco-Solutions"
          git config user.email "tassos.solutions@gmail.com"
          git add src/StudentsView.jsx .github/workflows/one-time-ocr-fix.yml
          git rm .github/workflows/one-time-ocr-fix.yml
          git commit -m "Improve OCR column matching and crop zoom crosshair"
          git push
