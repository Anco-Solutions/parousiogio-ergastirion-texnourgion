name: Apply UI and semester fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: !contains(github.event.head_commit.message, 'Apply UI and semester fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          s = app.read_text()

          s = s.replace("const DEFAULT_SEMESTER_CODE = 'ST'\n", "")
          s = s.replace("const DEFAULT_ACADEMIC_PERIOD = 'WINTER'", "const DEFAULT_ACADEMIC_PERIOD = 'WINTER'\n\nconst SEMESTERS_BY_PERIOD = {\n  WINTER: [\n    { code: 'A', name: 'Α' },\n    { code: 'D', name: 'Δ' },\n    { code: 'ST', name: 'ΣΤ' },\n  ],\n  SPRING: [\n    { code: 'B', name: 'Β' },\n    { code: 'G', name: 'Γ' },\n    { code: 'E', name: 'Ε' },\n  ],\n}")

          s = re.sub(r"const \[selectedSemesterCode, setSelectedSemesterCode\] = useState\(.*?\)", "const [selectedSemesterCode, setSelectedSemesterCode] = useState('')", s, count=1)
          s = re.sub(r"  function handleAcademicPeriodChange\(event\) \{.*?\n  function handleSemesterChange\(event\) \{.*?\n", "  function handleAcademicPeriodChange(event) { const period = event.target.value; setAcademicPeriod(period); setSelectedSemesterCode(''); localStorage.setItem('parousiologio_academic_period', period); localStorage.removeItem('parousiologio_current_semester') }\n  function handleSemesterChange(event) { const code = event.target.value; setSelectedSemesterCode(code); localStorage.setItem('parousiologio_current_semester', code) }\n", s, count=1, flags=re.S)
          s = re.sub(r"  useEffect\(\(\) => \{\n    async function loadSemesters\(\) \{.*?\n  \}, \[\]\)", "  useEffect(() => {\n    async function loadSemesters() {\n      if (!supabase) return\n      const { data, error } = await supabase.from('semesters').select('code,name')\n      if (error) { setSemesterError(error.message); return }\n      setSemesters(data ?? [])\n    }\n    loadSemesters()\n  }, [])\n\n  const semesterOptions = SEMESTERS_BY_PERIOD[academicPeriod] || []\n  const availableSemesterOptions = semesterOptions.map((option) => {\n    const dbSemester = semesters.find((semester) => semester.code === option.code)\n    return { ...option, name: dbSemester?.name || option.name }\n  })", s, count=1, flags=re.S)
          s = s.replace("const currentSemester = semesters.find((semester) => semester.code === selectedSemesterCode) || null", "const currentSemester = availableSemesterOptions.find((semester) => semester.code === selectedSemesterCode) || null")
          s = re.sub(r"\{semesters\.length > 0 \? <select className=\"semester-select\".*?</small>", "<select className=\"semester-select\" value={selectedSemesterCode} onChange={handleSemesterChange} aria-label=\"Επιλογή τρέχοντος εξαμήνου\"><option value=\"\">Επιλέξτε εξάμηνο</option>{availableSemesterOptions.map((semester) => <option key={semester.code} value={semester.code}>{semester.name}</option>)}</select><small>{currentSemester ? `Κωδικός: ${currentSemester.code}` : semesterError || 'Επιλέξτε το εξάμηνο για την επιλεγμένη ακαδημαϊκή περίοδο.'}</small>", s, count=1, flags=re.S)

          # Branding text throughout the application shell/dashboard.
          s = s.replace('AEN • ΕΡΓΑΣΤΗΡΙΑ ΤΕΧΝΟΛΟΓΙΩΝ', 'ΑΕΜ ΑΣΠΡΟΠΥΡΓΟΥ • ΣΧΟΛΗ ΜΗΧΑΝΙΚΩΝ')
          s = s.replace('Παρουσιολόγιο Εργαστηρίων Τεχνολογιών', 'Παρουσιολόγια Εργαστηρίων – Τεχνουργείων')
          s = s.replace('Κεντρικό περιβάλλον για σπουδαστές, ομάδες, μαθήματα, καθηγητές, πρόγραμμα και καταγραφή παρουσιών.', 'Κεντρικό περιβάλλον για σπουδαστές, ομάδες, μαθήματα, καθηγητές, πρόγραμμα και παρουσιολόγια εργαστηρίων – τεχνουργείων.')
          s = s.replace('Παρουσιολόγιο', 'Παρουσιολόγια')
          app.write_text(s)

          css = Path('src/readability.css')
          c = css.read_text()
          addition = r'''
/* Final responsive hardening */
html, body, #root { width: 100%; max-width: 100%; overflow-x: hidden; }
img, svg, canvas, video { max-width: 100%; height: auto; }
input, select, textarea, button { max-width: 100%; }
.semester-select { width: 100%; min-height: 48px; }
@media (max-width: 900px) {
  .layout, main, .hero, .page-title-row, .toolbar, .data-card { min-width: 0; width: 100%; max-width: 100%; }
  .module-grid { min-width: 0; }
  .module-card, .module-card span { min-width: 0; }
  .module-card strong, .module-card small, .page-title-row p { overflow-wrap: anywhere; word-break: break-word; }
}
@media (max-width: 650px) {
  main { padding: 22px 12px 42px; }
  .topbar { padding: 14px 12px; }
  .hero { gap: 16px; }
  .semester-card { padding: 18px; }
  .table-wrap { overflow: visible; }
  table { display: block; min-width: 0; width: 100%; }
  thead { display: none; }
  tbody { display: block; width: 100%; }
  tr { display: block; width: 100%; padding: 12px 14px; border-bottom: 1px solid #edf1f6; }
  td { display: grid; grid-template-columns: minmax(92px, 36%) minmax(0, 1fr); gap: 10px; width: 100%; padding: 8px 0; border: 0; overflow-wrap: anywhere; word-break: break-word; }
  td::before { content: attr(data-label); color: #64748b; font-weight: 800; }
  .toolbar { flex-direction: column; }
  .toolbar input, .toolbar button { width: 100%; }
  .signature-actions { flex-direction: column; }
  .signature-actions button { width: 100%; }
}
'''
          if 'Final responsive hardening' not in c:
              css.write_text(c + addition)

      - name: Verify and commit application changes
        run: |
          grep -q "SEMESTERS_BY_PERIOD" src/App.jsx
          grep -q "Επιλέξτε εξάμηνο" src/App.jsx
          grep -q "Final responsive hardening" src/readability.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/readability.css
          git commit -m "Apply UI and semester fixes"
          git push
