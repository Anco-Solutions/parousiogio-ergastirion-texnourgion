name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate OCR columns parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/StudentsView.jsx')
          s = path.read_text(encoding='utf-8')
          if "./ocrColumnsV2" not in s:
              s = "import { parseOcrColumnsV2 } from './ocrColumnsV2'\n" + s
          s = s.replace('const parsedByColumns = parseOcrWords(result.data.words || [])', 'const parsedByColumns = await parseOcrColumnsV2(file)')
          s = s.replace('const parsedByColumns = await parseOcrColumns(file, worker)', 'const parsedByColumns = await parseOcrColumnsV2(file)')
          path.write_text(s, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4