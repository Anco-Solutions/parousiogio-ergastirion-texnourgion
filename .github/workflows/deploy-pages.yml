name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade OCR parser to three fields for this build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/StudentsView.jsx')
          s = path.read_text(encoding='utf-8')
          start = s.index('function parseOcrWords(words) {')
          end = s.index('\n\nasync function prepareImage', start)
          new_parser = r'''function parseOcrWords(words) {
  const usable = (words || []).map((word) => {
    const text = normalizeOcrLine(word?.text || '')
    const bbox = word?.bbox || {}
    const x = Number(bbox.x0), y = Number(bbox.y0), x1 = Number(bbox.x1), y1 = Number(bbox.y1)
    return { text, x, y, x1, y1, cy: (y + y1) / 2, h: Math.max(1, y1 - y) }
  }).filter((word) => word.text && Number.isFinite(word.x) && Number.isFinite(word.y) && Number.isFinite(word.x1) && Number.isFinite(word.y1))
  usable.sort((a, b) => a.cy - b.cy || a.x - b.x)
  const rows = []
  for (const word of usable) {
    let row = rows.find((candidate) => Math.abs(candidate.cy - word.cy) <= Math.max(14, Math.min(candidate.h, word.h) * 0.8))
    if (!row) { row = { cy: word.cy, h: word.h, words: [] }; rows.push(row) }
    row.words.push(word)
    row.cy = row.words.reduce((sum, item) => sum + item.cy, 0) / row.words.length
    row.h = Math.max(row.h, word.h)
  }
  const results = []
  const seen = new Set()
  for (const row of rows.sort((a, b) => a.cy - b.cy)) {
    const lineWords = row.words.sort((a, b) => a.x - b.x)
    let numberIndex = -1
    let registryNumber = ''
    for (let i = 0; i < lineWords.length; i += 1) {
      const candidate = normalizeRegistryToken(lineWords[i].text)
      if (candidate.length >= 4 && candidate.length <= 6 && /^[0-9]{4,6}$/.test(candidate)) { numberIndex = i; registryNumber = candidate; break }
    }
    if (numberIndex < 0 || seen.has(registryNumber)) continue
    const nameWords = lineWords.slice(numberIndex + 1).map((word) => word.text).filter((text) => /[A-ZΑ-ΩΆΈΉΊΌΎΏα-ωάέήίόύώ]{2,}/u.test(text))
    if (nameWords.length < 2) continue
    const lastName = cleanName(nameWords[0])
    const firstName = cleanName(nameWords.slice(1).join(' '))
    if (!lastName || !firstName) continue
    seen.add(registryNumber)
    results.push({ registryNumber, fullName: `${lastName} ${firstName}`.trim(), lastName, firstName })
  }
  return results
}

async function parseOcrColumns(file, worker) {
  const bitmap = await createImageBitmap(file)
  try {
    const width = bitmap.width
    const height = bitmap.height
    const split = Math.round(width * 0.30)
    const makeColumn = async (fromX, toX) => {
      const sourceWidth = Math.max(1, toX - fromX)
      const scale = Math.min(2.5, 2200 / sourceWidth)
      const canvas = document.createElement('canvas')
      canvas.width = Math.max(1, Math.round(sourceWidth * scale))
      canvas.height = Math.max(1, Math.round(height * scale))
      const ctx = canvas.getContext('2d', { willReadFrequently: true })
      ctx.imageSmoothingEnabled = true
      ctx.drawImage(bitmap, fromX, 0, sourceWidth, height, 0, 0, canvas.width, canvas.height)
      const image = ctx.getImageData(0, 0, canvas.width, canvas.height)
      const d = image.data
      for (let i = 0; i < d.length; i += 4) {
        const y = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114
        const v = Math.max(0, Math.min(255, ((y - 128) * 1.7) + 128))
        d[i] = v; d[i + 1] = v; d[i + 2] = v
      }
      ctx.putImageData(image, 0, 0)
      return new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('OCR column image failed')), 'image/jpeg', 0.96))
    }
    const numberBlob = await makeColumn(0, split)
    const nameBlob = await makeColumn(split, width)
    const numberResult = await worker.recognize(numberBlob, { tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' })
    const nameResult = await worker.recognize(nameBlob, { tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' })
    const collectRows = (words) => {
      const usable = (words || []).map((w) => {
        const b = w?.bbox || {}
        const text = normalizeOcrLine(w?.text || '')
        const x = Number(b.x0), y = Number(b.y0), x1 = Number(b.x1), y1 = Number(b.y1)
        return { text, x, y, x1, y1, cy: (y + y1) / 2, h: Math.max(1, y1 - y) }
      }).filter((w) => w.text && Number.isFinite(w.x) && Number.isFinite(w.y) && Number.isFinite(w.x1) && Number.isFinite(w.y1))
      usable.sort((a, b) => a.cy - b.cy || a.x - b.x)
      const rows = []
      for (const w of usable) {
        let row = rows.find((r) => Math.abs(r.cy - w.cy) <= Math.max(14, Math.min(r.h, w.h) * 0.8))
        if (!row) { row = { cy: w.cy, h: w.h, words: [] }; rows.push(row) }
        row.words.push(w)
        row.cy = row.words.reduce((sum, q) => sum + q.cy, 0) / row.words.length
        row.h = Math.max(row.h, w.h)
      }
      return rows.sort((a, b) => a.cy - b.cy).map((r) => ({ cy: r.cy, text: r.words.sort((a, b) => a.x - b.x).map((w) => w.text).join(' ') }))
    }
    const numberRows = collectRows(numberResult.data.words || [])
    const nameRows = collectRows(nameResult.data.words || [])
    const nums = []
    for (const row of numberRows) {
      const matches = row.text.match(/[0-9ΟOIΙΖZΕEAΑSΣGΓΤTΒBqQ]{3,8}/g) || []
      for (const token of matches) {
        const n = normalizeRegistryToken(token)
        if (n.length >= 4 && n.length <= 6) { nums.push({ cy: row.cy, registryNumber: n }); break }
      }
    }
    const names = nameRows.map((row) => ({ cy: row.cy, fullName: cleanName(row.text) })).filter((row) => /[A-ZΑ-ΩΆΈΉΊΌΎΏα-ωάέήίόύώ]{2,}/u.test(row.fullName))
    const results = []
    const usedNames = new Set()
    for (const n of nums) {
      let best = null
      let bestDistance = Infinity
      for (const row of names) {
        const distance = Math.abs(row.cy - n.cy)
        if (distance < bestDistance && distance <= 90 && !usedNames.has(row)) { best = row; bestDistance = distance }
      }
      if (!best || results.some((item) => item.registryNumber === n.registryNumber)) continue
      const parts = best.fullName.split(/\s+/).filter(Boolean)
      if (parts.length < 2) continue
      usedNames.add(best)
      results.push({ registryNumber: n.registryNumber, fullName: best.fullName, lastName: parts[0], firstName: parts.slice(1).join(' ') })
    }
    return results
  } finally {
    bitmap.close?.()
  }
}
'''
          s = s[:start] + new_parser + s[end:]
          s = s.replace('const parsedByColumns = parseOcrWords(result.data.words || [])', 'const parsedByColumns = await parseOcrColumns(file, worker)')
          path.write_text(s, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
