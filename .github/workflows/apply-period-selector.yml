name: Apply academic period selector

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add academic period selector
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          if 'const ACADEMIC_PERIODS = [' in text:
              print('Academic period selector already present; nothing to do.')
              raise SystemExit(0)

          text = text.replace(
              "const DEFAULT_SEMESTER_CODE = 'ST'\n",
              "const DEFAULT_SEMESTER_CODE = 'ST'\nconst ACADEMIC_PERIODS = [\n  { code: 'WINTER', name: '❄️ Χειμερινό' },\n  { code: 'SPRING', name: '🌸 Εαρινό' },\n]\nconst DEFAULT_ACADEMIC_PERIOD = 'WINTER'\n"
          )

          text = text.replace(
              "  const [semesterError, setSemesterError] = useState('')\n",
              "  const [semesterError, setSemesterError] = useState('')\n  const [academicPeriod, setAcademicPeriod] = useState(() => {\n    if (typeof window === 'undefined') return DEFAULT_ACADEMIC_PERIOD\n    return localStorage.getItem('parousiologio_academic_period') || DEFAULT_ACADEMIC_PERIOD\n  })\n"
          )

          text = text.replace(
              "  function handleSemesterChange(event) {\n",
              "  function handleAcademicPeriodChange(event) {\n    const period = event.target.value\n    setAcademicPeriod(period)\n    localStorage.setItem('parousiologio_academic_period', period)\n  }\n\n  function handleSemesterChange(event) {\n"
          )

          old = '''              <div className="semester-card">\n                <span>Τρέχον εξάμηνο</span>\n                {semesters.length > 0 ? (\n                  <select className="semester-select" value={selectedSemesterCode} onChange={handleSemesterChange} aria-label="Επιλογή τρέχοντος εξαμήνου">\n                    {semesters.map((semester) => <option key={semester.code} value={semester.code}>{semester.name}</option>)}\n                  </select>\n                ) : (\n                  <strong>{semesterError ? 'Σφάλμα φόρτωσης' : 'Φόρτωση…'}</strong>\n                )}\n                <small>{currentSemester ? `Κωδικός: ${currentSemester.code}` : semesterError || 'Ανάκτηση από τον πίνακα semesters'}</small>\n              </div>'''

          new = '''              <div className="semester-card">\n                <span>Ακαδημαϊκή περίοδος</span>\n                <select className="semester-select" value={academicPeriod} onChange={handleAcademicPeriodChange} aria-label="Επιλογή ακαδημαϊκής περιόδου">\n                  {ACADEMIC_PERIODS.map((period) => <option key={period.code} value={period.code}>{period.name}</option>)}\n                </select>\n                <span style={{ marginTop: '0.65rem' }}>Εξάμηνο</span>\n                {semesters.length > 0 ? (\n                  <select className="semester-select" value={selectedSemesterCode} onChange={handleSemesterChange} aria-label="Επιλογή τρέχοντος εξαμήνου">\n                    {semesters.map((semester) => <option key={semester.code} value={semester.code}>{semester.name}</option>)}\n                  </select>\n                ) : (\n                  <strong>{semesterError ? 'Σφάλμα φόρτωσης' : 'Φόρτωση…'}</strong>\n                )}\n                <small>{currentSemester ? `Κωδικός: ${currentSemester.code}` : semesterError || 'Ανάκτηση από τον πίνακα semesters'}</small>\n              </div>'''

          if old not in text:
              raise SystemExit('Expected semester card markup was not found; no changes made.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Academic period selector added.')

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/apply-period-selector.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add winter spring academic period selector"
          git rm .github/workflows/apply-period-selector.yml
          git commit -m "Remove one-time academic period migration workflow"
          git push
