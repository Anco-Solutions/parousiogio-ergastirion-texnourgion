name: Apply crop editor correction

on:
  push:
    paths:
      - '.github/workflows/patch-crop-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch crop editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/StudentsView.jsx')
          s = path.read_text(encoding='utf-8')

          old = "function CropEditor({ file, onApply, onSkip, onBack }) {\n  const [imageUrl, setImageUrl] = useState(''); const [imageSize, setImageSize] = useState({ width: 1, height: 1 }); const [corners, setCorners] = useState({ nw: { x: 6, y: 5 }, ne: { x: 94, y: 5 }, se: { x: 94, y: 93 }, sw: { x: 6, y: 93 } });"
          new = "function CropEditor({ file, onApply, onSkip, onBack, initialCorners }) {\n  const [imageUrl, setImageUrl] = useState(''); const [imageSize, setImageSize] = useState({ width: 1, height: 1 }); const [corners, setCorners] = useState(() => initialCorners || { nw: { x: 6, y: 5 }, ne: { x: 94, y: 5 }, se: { x: 94, y: 93 }, sw: { x: 6, y: 93 } });"
          if old not in s: raise SystemExit('signature anchor not found')
          s=s.replace(old,new,1)

          old = "useEffect(() => { const url = URL.createObjectURL(file); setImageUrl(url); const probe = new Image();"
          new = "useEffect(() => { const url = URL.createObjectURL(file); setImageUrl(url); setCorners(initialCorners || { nw: { x: 6, y: 5 }, ne: { x: 94, y: 5 }, se: { x: 94, y: 93 }, sw: { x: 6, y: 93 } }); setActiveCorner(null); const probe = new Image();"
          if old not in s: raise SystemExit('effect anchor not found')
          s=s.replace(old,new,1)

          old = "onApply(new File([blob], 'attendance-perspective-cropped.jpg', { type: 'image/jpeg' }))"
          new = "onApply(new File([blob], 'attendance-perspective-cropped.jpg', { type: 'image/jpeg' }), JSON.parse(JSON.stringify(corners)))"
          if old not in s: raise SystemExit('onApply anchor not found')
          s=s.replace(old,new,1)

          old = "const zoomImageTop = (zoomSize / 2) - (activePoint ? (activePoint.y / 100) * zoomImageHeight : 0)\n  return <div"
          new = "const zoomImageTop = (zoomSize / 2) - (activePoint ? (activePoint.y / 100) * zoomImageHeight : 0); const zoomPosition = activePoint ? { left: activePoint.x > 50 ? 10 : undefined, right: activePoint.x > 50 ? undefined : 10, top: activePoint.y > 50 ? 10 : undefined, bottom: activePoint.y > 50 ? undefined : 10 } : {}\n  return <div"
          if old not in s: raise SystemExit('zoom anchor not found')
          s=s.replace(old,new,1)

          old = "{activePoint && <div style={{ position: 'absolute', right: 10, top: 10, width: zoomSize"
          new = "{activePoint && <div style={{ position: 'absolute', ...zoomPosition, width: zoomSize"
          if old not in s: raise SystemExit('zoom style anchor not found')
          s=s.replace(old,new,1)

          old = "const [file, setFile] = useState(null); const [previewUrl, setPreviewUrl] = useState('');"
          new = "const [file, setFile] = useState(null); const [sourceFile, setSourceFile] = useState(null); const [cropCorners, setCropCorners] = useState(null); const [previewUrl, setPreviewUrl] = useState('');"
          if old not in s: raise SystemExit('state anchor not found')
          s=s.replace(old,new,1)

          old = "function setImageFile(nextFile, requestCrop = true) { if (!nextFile) return; if (previewUrl) URL.revokeObjectURL(previewUrl); setFile(nextFile); setPreviewUrl(URL.createObjectURL(nextFile)); setItems([]); setOcrText(''); setError(''); setProgress(''); setNeedsCrop(requestCrop) }"
          new = "function setImageFile(nextFile, requestCrop = true) { if (!nextFile) return; if (previewUrl) URL.revokeObjectURL(previewUrl); if (requestCrop) { setSourceFile(nextFile); setCropCorners(null) }; setFile(nextFile); setPreviewUrl(URL.createObjectURL(nextFile)); setItems([]); setOcrText(''); setError(''); setProgress(''); setNeedsCrop(requestCrop) }"
          if old not in s: raise SystemExit('setImageFile anchor not found')
          s=s.replace(old,new,1)

          old = "{!cameraOpen && previewUrl && needsCrop && <CropEditor file={file} onApply={(cropped) => setImageFile(cropped, false)} onSkip={() => setNeedsCrop(false)} onBack={() => { setNeedsCrop(false); setFile(null); setPreviewUrl('') }} />}"
          new = "{!cameraOpen && previewUrl && needsCrop && <CropEditor file={sourceFile || file} initialCorners={cropCorners} onApply={(cropped, selectedCorners) => { if (previewUrl) URL.revokeObjectURL(previewUrl); setFile(cropped); setCropCorners(selectedCorners); setPreviewUrl(URL.createObjectURL(cropped)); setNeedsCrop(false); setItems([]); setOcrText(''); setError(''); setProgress('') }} onSkip={() => setNeedsCrop(false)} onBack={() => { setNeedsCrop(false); setFile(null); setSourceFile(null); setCropCorners(null); setPreviewUrl('') }} />}"
          if old not in s: raise SystemExit('CropEditor render anchor not found')
          s=s.replace(old,new,1)

          old = "<button type=\"button\" className=\"secondary-button\" onClick={() => setNeedsCrop(true)}>✂️ Ξανά 4 γωνίες</button>"
          new = "<button type=\"button\" className=\"secondary-button\" onClick={() => { setNeedsCrop(true); setItems([]); setOcrText(''); setError(''); setProgress('') }} disabled={!sourceFile}>✂️ Ξανά 4 γωνίες</button>"
          if old not in s: raise SystemExit('recrop button anchor not found')
          s=s.replace(old,new,1)

          old = "onClick={() => { setFile(null); setPreviewUrl(''); setNeedsCrop(false) }}"
          new = "onClick={() => { setFile(null); setSourceFile(null); setCropCorners(null); setPreviewUrl(''); setNeedsCrop(false) }}"
          if old not in s: raise SystemExit('discard anchor not found')
          s=s.replace(old,new,1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/StudentsView.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix crop zoom placement and preserve recrop corners'
          git push origin main
